name: Kart Regression Checks

on:
  pull_request:
    paths:
      - 'src/kart/**'
      - 'src/game/**'
      - 'scripts/test-kart-*.mjs'
      - 'package.json'
      - '.github/workflows/kart-regressions.yml'
  push:
    branches: [main, aaa-kart-ci]
    paths:
      - 'src/kart/**'
      - 'src/game/**'
      - 'scripts/test-kart-*.mjs'
      - 'package.json'
      - '.github/workflows/kart-regressions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kart-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # These tests use Node built-ins and pure game modules only.
      - name: Persistence and controller regressions
        run: npm run test:kart:regressions
