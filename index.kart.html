         the old Google link served for the faces the game uses (Inter
         400/500/600/700, JetBrains Mono 400/500/700), so every font-family in
         the app resolves as before. Instrument Serif was dropped: only a dev
         harness outside the kart build uses it. Inter and JetBrains Mono are variable
         fonts: one file backs all of their weights. Subsets are latin only,
