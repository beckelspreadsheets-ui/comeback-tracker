<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Comeback City Arcade Kart V2 Trait Cards</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #071522;
        color: #eef8ff;
      }
      body {
        margin: 0;
        padding: 24px;
        background: #071522;
      }
      header {
        display: grid;
        gap: 6px;
        margin: 0 0 18px;
      }
      h1 {
        margin: 0;
        font-size: 22px;
        line-height: 1.1;
        text-transform: uppercase;
      }
      p {
        margin: 0;
        color: #b8e9f5;
      }
      section {
        display: grid;
        gap: 14px;
        margin-top: 24px;
      }
      h2 {
        margin: 0;
        font-size: 14px;
        text-transform: uppercase;
        color: #9cf0ff;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
        gap: 16px;
      }
      figure {
        margin: 0;
        overflow: hidden;
        border: 1px solid rgba(120, 233, 255, 0.28);
        border-radius: 8px;
        background: rgba(3, 11, 19, 0.78);
      }
      img {
        display: block;
        width: 100%;
        height: auto;
      }
      figcaption {
        padding: 10px 12px;
        color: #e9fbff;
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Comeback City Arcade Kart V2 Trait Cards</h1>
      <p>Design-lock reference set for the next 3D/runtime implementation pass.</p>
    </header>

    <section>
      <h2>Carts</h2>
      <div class="grid">
        <figure><img src="hero-red-kart-trait-card-v2.png" alt="Hero red kart trait card" /><figcaption>Hero Red Kart</figcaption></figure>
        <figure><img src="purple-tech-rival-trait-card-v2.png" alt="Purple tech rival trait card" /><figcaption>Purple Tech Rival</figcaption></figure>
        <figure><img src="blue-speed-rival-trait-card-v2.png" alt="Blue speed rival trait card" /><figcaption>Blue Speed Rival</figcaption></figure>
        <figure><img src="orange-muscle-rival-trait-card-v2.png" alt="Orange muscle rival trait card" /><figcaption>Orange Muscle Rival</figcaption></figure>
        <figure><img src="green-utility-rival-trait-card-v2.png" alt="Green utility rival trait card" /><figcaption>Green Utility Rival</figcaption></figure>
        <figure><img src="black-gold-elite-rival-trait-card-v2.png" alt="Black gold elite rival trait card" /><figcaption>Black/Gold Elite Rival</figcaption></figure>
        <figure><img src="white-red-support-rival-trait-card-v2.png" alt="White red support rival trait card" /><figcaption>White/Red Support Rival</figcaption></figure>
      </div>
    </section>

    <section>
      <h2>Environment And Gameplay</h2>
      <div class="grid">
        <figure><img src="track-geometry-road-system-trait-card-v2.png" alt="Track geometry and road system trait card" /><figcaption>Track Geometry / Road System</figcaption></figure>
        <figure><img src="district-portals-facades-trait-card-v2.png" alt="District portals and facades trait card" /><figcaption>District Portals / Facades</figcaption></figure>
        <figure><img src="roadside-props-barriers-trait-card-v2.png" alt="Roadside props and barriers trait card" /><figcaption>Roadside Props / Barriers</figcaption></figure>
        <figure><img src="pickups-boost-vfx-trait-card-v2.png" alt="Pickups boost and VFX trait card" /><figcaption>Pickups / Boost / VFX</figcaption></figure>
        <figure><img src="material-lighting-camera-trait-card-v2.png" alt="Material lighting and camera trait card" /><figcaption>Materials / Lighting / Camera</figcaption></figure>
      </div>
    </section>
  </body>
</html>
