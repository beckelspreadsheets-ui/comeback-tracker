<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Showcase Designs</title>
    <meta name="description" content="The requested Showcase Designs page could not be found.">
    <meta name="robots" content="noindex,follow">
    <meta name="theme-color" content="#0a0a0a">
    <link rel="canonical" href="https://showcase-designs.com/404.html">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prata&family=Manrope:wght@400;500;600;700&display=optional" rel="stylesheet">
    <style>
        :root {
            --black: #0a0a0a;
            --text: #f5f0e8;
            --muted: #a49d8f;
            --gold: #c9a227;
            --line: rgba(245, 240, 232, 0.12);
        }

        * { box-sizing: border-box; }

        html { min-height: 100%; background: var(--black); }

        body {
            min-height: 100vh;
            margin: 0;
            font-family: "Manrope", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 72% 18%, rgba(201, 162, 39, 0.14), transparent 30rem),
                radial-gradient(circle at 18% 78%, rgba(245, 240, 232, 0.06), transparent 28rem),
                var(--black);
            display: grid;
            place-items: center;
            padding: 2rem;
        }

        main {
            width: min(100%, 48rem);
            border: 1px solid var(--line);
            background: rgba(18, 18, 18, 0.82);
            padding: clamp(2rem, 6vw, 4rem);
            box-shadow: 0 2rem 6rem rgba(0, 0, 0, 0.38);
        }

        .code {
            margin: 0 0 1.25rem;
            color: var(--gold);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.22em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-family: "Prata", Georgia, serif;
            font-size: clamp(2.7rem, 8vw, 5.8rem);
            line-height: 0.96;
            letter-spacing: 0;
        }

        p {
            margin: 1.35rem 0 0;
            color: var(--muted);
            font-size: clamp(1rem, 2vw, 1.15rem);
            line-height: 1.75;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.85rem;
            margin-top: 2.25rem;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 3rem;
            padding: 0 1.2rem;
            border: 1px solid var(--line);
            color: var(--text);
            text-decoration: none;
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .button.primary {
            border-color: var(--gold);
            background: var(--gold);
            color: var(--black);
        }

        @media (max-width: 520px) {
            body { padding: 1rem; }
            main { padding: 1.6rem; }
            .actions { display: grid; }
        }
    </style>
</head>
<body>
    <main>
        <p class="code">404</p>
        <h1>That page is not in the Showcase Designs build.</h1>
        <p>Let's get you back to the right Showcase Designs page: the standard site, recent work, or the opt-in studio gallery.</p>
        <div class="actions">
            <a class="button primary" href="/">Back to home</a>
            <a class="button" href="/#work">View work</a>
            <a class="button" href="/world">Studio</a>
        </div>
    </main>
</body>
</html>
